[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"


[project]
name = "livro-abm-python"
version = "0.1.0"
description = "Código, experimentos e materiais complementares do livro Modelagem Baseada em Agentes em Python."
readme = "README.md"
requires-python = ">=3.11"

authors = [
    { name = "Gilberto Gil F. G. Passos" },
    { name = "Cristiano Fuschilo" },
    { name = "Raphael Mauricio" },
]

keywords = [
    "agent-based modeling",
    "abm",
    "python",
    "simulation",
    "complex systems",
    "computational modeling",
    "multi-agent systems",
    "education",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "matplotlib>=3.8",
]


[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
]


[tool.setuptools.packages.find]
where = ["src"]


# =========================================================
# Ruff
# =========================================================

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "notebooks",
]


[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # Pyflakes
    "I",      # import sorting
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "SIM",    # simplificações
]

ignore = []


[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"


# =========================================================
# Pytest
# =========================================================

[tool.pytest.ini_options]
testpaths = ["tests"]

python_files = [
    "test_*.py",
]

python_functions = [
    "test_*",
]

addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]

markers = [
    "slow: testes computacionalmente mais caros",
    "statistical: testes envolvendo propriedades estatísticas",
]


# =========================================================
# Coverage
# =========================================================

[tool.coverage.run]
branch = true
source = ["src"]


[tool.coverage.report]
show_missing = true
skip_covered = true

exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]


# =========================================================
# Mypy
# =========================================================

[tool.mypy]
python_version = "3.11"

files = [
    "src",
]

check_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

disallow_untyped_defs = false

pretty = true
show_error_codes = true